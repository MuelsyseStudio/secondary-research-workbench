[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant_engine"
version = "0.1.0"
description = "Secondary Research Workbench - Original Multi-Market DuckDB & Event-Driven Backtest Engine (MIT/BSD/Apache-2.0 stack)"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "requests>=2.31.0",
    "baostock>=0.8.9",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
[tool.setuptools.packages.find]
where = ["."]
include = ["quant_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
